# Include inside the host nginx http block (e.g. /etc/nginx/conf.d/neo-watch.conf).
# Use an available local port; let the existing reverse proxy handle TLS.
server {
    listen 127.0.0.1:8081;
    server_name _;
    root /opt/neo-watch/current/dist;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    location = /health {
        proxy_pass http://127.0.0.1:4180;
        proxy_read_timeout 5s;
    }
    location = /api/neo/today {
        proxy_pass http://127.0.0.1:4180;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
    location /api/ { return 404; }
    location ~ /\. { deny all; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ =404; }
}
