name: neo-watch
services:
  web:
    image: nginx:stable-alpine
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    volumes:
      - ../dist:/srv/www:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      backend:
      proxy:
        aliases: [neo-watch-web]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
  api:
    image: node:22-alpine
    user: "1000:1000"
    working_dir: /app
    command: ["node", "server/service.mjs"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: /opt/neo-watch/shared/api.env
    environment:
      PORT: "8080"
      FEED_CACHE_FILE: /cache/today.json
    volumes:
      - ../server:/app/server:ro
      - ../deploy:/app/deploy:ro
      - ../src:/app/src:ro
      - ../package.json:/app/package.json:ro
      - /opt/neo-watch/shared/cache:/cache
    networks: [backend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
networks:
  backend:
  proxy:
    external: true
    name: techainetwork
